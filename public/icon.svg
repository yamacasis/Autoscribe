<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Subtle Network Grid / Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2"/>

  <!-- VPN Shield Shape -->
  <path d="M 256 72 L 396 132 C 396 264 336 376 256 424 C 176 376 116 264 116 132 Z" 
        fill="rgba(14, 23, 42, 0.85)" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#glow)"/>

  <!-- Speed Needle / Lightning Pulse -->
  <path d="M 270 148 L 196 268 L 246 268 L 232 364 L 320 236 L 270 236 Z" 
        fill="url(#neonGlow)"/>

  <!-- CLI Prompt Symbol -->
  <path d="M 160 210 L 195 240 L 160 270" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8"/>
  <line x1="205" y1="270" x2="225" y2="270" 
        stroke="#38bdf8" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.8"/>
</svg>
